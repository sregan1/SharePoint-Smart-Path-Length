name: Release

# Runs on every push to main. If a Release for the package.json version already
# exists the run is a no-op; otherwise it builds and creates the vX.Y.Z tag +
# Release. Releasing is: bump the version, add the CHANGELOG entry, push to main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      needed: ${{ steps.ver.outputs.needed }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and whether a release is needed
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Matches package.json "engines".node (>=18.17.1 <19.0.0) — SPFx is
          # picky about the Node major, so this stays pinned rather than 'lts'.
          node-version: '18.17.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build release package
        run: |
          npx gulp clean
          npm run ship

      - name: Locate .sppkg
        id: sppkg
        run: |
          PKG=$(find sharepoint/solution -maxdepth 1 -name '*.sppkg' | head -n1)
          if [ -z "$PKG" ]; then
            echo "No .sppkg found under sharepoint/solution" >&2
            exit 1
          fi
          echo "path=$PKG" >> "$GITHUB_OUTPUT"

      # Pulls this version's section out of CHANGELOG.md to use as the release
      # body. Fails loudly rather than publishing an empty release: a silently
      # note-less release is the same class of problem as a missing one.
      - name: Extract this version's CHANGELOG section
        run: |
          # Matched with index() rather than a regex so the literal "[" needs no
          # escaping — backslashes here have to survive YAML, the shell and awk's
          # own string lexer, and silently degrade into a broken pattern if any
          # layer eats one.
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1      { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found                    { print }
          ' CHANGELOG.md > changelog-section.md
          # Strip the trailing "---" separator and any blank lines around it.
          sed -i -e 's/^---$//' changelog-section.md
          if [ ! -s changelog-section.md ] || ! grep -q '[^[:space:]]' changelog-section.md; then
            echo "No CHANGELOG.md section found for [$VERSION]" >&2
            exit 1
          fi
          echo "Release notes for $VERSION:"
          cat changelog-section.md

      - name: Build release notes
        run: |
          {
            echo "## Installation"
            echo ""
            echo "1. Download \`sharepoint-smart-path-length.sppkg\`"
            echo "2. Upload to your SharePoint App Catalog"
            echo "3. Deploy tenant-wide or to specific sites"
            echo ""
          } > release-notes.md
          cat changelog-section.md >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check.outputs.version }}
          files: ${{ steps.sppkg.outputs.path }}
          body_path: release-notes.md
